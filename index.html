<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sigma Gümrük</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

  <!--
    IMPORTANT:
    world-map.png is 610 x 409.
    The SVG now uses exactly the same coordinate system.
  -->
  <style>
    .hero-map {
      aspect-ratio: 610 / 409;
    }
  </style>
</head>

<body>

  <!-- =====================================================
       LOADING SCREEN
  ====================================================== -->

  <div id="loader" class="loader">

    <div class="loader-inner">

      <div class="loader-logo">
        SIGMA
      </div>

      <div class="loader-bar">
        <div
          class="loader-bar-fill"
          id="loaderBarFill">
        </div>
      </div>

      <div
        class="loader-percent"
        id="loaderPercent">
        0%
      </div>

    </div>

  </div>


  <!-- =====================================================
       LANGUAGE SELECTION
  ====================================================== -->

  <div
    id="langScreen"
    class="lang-screen hidden"
  >

    <div class="lang-inner">

      <h1 class="lang-title">
        Dil Seçin / Choose Language
      </h1>

      <div class="lang-buttons">

        <button
          class="lang-btn"
          data-lang="tr"
        >
          <span class="lang-flag">
            🇹🇷
          </span>

          <span class="lang-name">
            Türkçe
          </span>
        </button>


        <button
          class="lang-btn"
          data-lang="en"
        >
          <span class="lang-flag">
            🇬🇧
          </span>

          <span class="lang-name">
            English
          </span>
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       MAIN SITE
  ====================================================== -->

  <div
    id="site"
    class="site hidden"
  >


    <!-- ===================================================
         DYNAMIC ISLAND NAVBAR
    ==================================================== -->

    <header
      id="navIsland"
      class="nav-island"
    >

      <div class="nav-island-inner">


        <!-- LOGO -->

        <a
          href="#"
          class="nav-island-logo"
        >

          <img
            src="logo.png"
            alt="Sigma Gümrük Müşavirliği"
          >

        </a>


        <!-- DESKTOP NAVIGATION -->

        <nav
          class="nav-island-links"
          aria-label="Primary"
        >

          <a
            href="#"
            data-i18n="nav_home"
          ></a>

          <a
            href="#services"
            data-i18n="nav_services"
          ></a>

          <a
            href="#about"
            data-i18n="nav_about"
          ></a>

          <a
            href="#contact"
            data-i18n="nav_contact"
          ></a>

        </nav>


        <!-- ACTIONS -->

        <div class="nav-island-actions">

          <button
            id="langToggle"
            class="lang-toggle"
          ></button>


          <button
            id="navMenuToggle"
            class="nav-menu-toggle"
            aria-label="Menüyü aç"
            aria-expanded="false"
          >

            <span></span>
            <span></span>
            <span></span>

          </button>

        </div>

      </div>

    </header>


    <!-- ===================================================
         MOBILE DROPDOWN
    ==================================================== -->

    <div
      id="navDropdown"
      class="nav-dropdown"
    >

      <a
        href="#"
        data-i18n="nav_home"
      ></a>

      <a
        href="#services"
        data-i18n="nav_services"
      ></a>

      <a
        href="#about"
        data-i18n="nav_about"
      ></a>

      <a
        href="#contact"
        data-i18n="nav_contact"
      ></a>

    </div>


    <!-- ===================================================
         HERO
    ==================================================== -->

    <main class="hero">


      <!-- =================================================
           WORLD MAP
      ================================================== -->

      <div
        class="hero-map"
        aria-hidden="true"
      >

        <img
          src="world-map.png"
          alt=""
          class="hero-map-img"
        >


        <!--
          IMPORTANT

          world-map.png = 610 x 409

          Therefore:
          SVG viewBox = 0 0 610 409

          This keeps every SVG coordinate aligned
          with the actual map.
        -->

        <svg
          class="hero-map-network"
          viewBox="0 0 610 409"
          preserveAspectRatio="xMidYMid meet"
        >


          <!-- =================================================
               TRADE ROUTES
          ================================================== -->


          <!--
            TURKEY → NORTH AMERICA

            Turkey:
            approximately 325,181

            North America:
            approximately 145,159
          -->

          <path
            class="hero-arc"
            style="animation-delay: 0s"
            d="M325,181 Q235,115 145,159"
          />


          <!--
            TURKEY → NORTHERN EUROPE
          -->

          <path
            class="hero-arc"
            style="animation-delay: 0.4s"
            d="M325,181 Q300,135 275,120"
          />


          <!--
            TURKEY → CENTRAL ASIA
          -->

          <path
            class="hero-arc"
            style="animation-delay: 0.8s"
            d="M325,181 Q350,155 380,160"
          />


          <!--
            TURKEY → EAST ASIA
          -->

          <path
            class="hero-arc"
            style="animation-delay: 1.2s"
            d="M325,181 Q405,125 485,154"
          />


          <!--
            TURKEY → SOUTHEAST ASIA
          -->

          <path
            class="hero-arc"
            style="animation-delay: 1.6s"
            d="M325,181 Q405,165 455,215"
          />



          <!-- =================================================
               PULSE RINGS
          ================================================== -->


          <!--
            MAIN TURKEY HUB

            This is now positioned directly
            on Turkey.
          -->

          <!-- MAIN TURKEY HUB -->

<circle
  class="hero-pulse"
  cx="325"
  cy="187"
  r="4"
  style="animation-delay: 0s"
/>

<circle
  class="hero-dot hero-dot--hub"
  cx="325"
  cy="187"
  r="6"
/>


          <!-- North America -->

          <circle
            class="hero-pulse"
            cx="145"
            cy="159"
            r="4"
            style="animation-delay: 0.3s"
          />


          <!-- Northern Europe -->

          <circle
            class="hero-pulse"
            cx="275"
            cy="120"
            r="4"
            style="animation-delay: 0.6s"
          />


          <!-- Central Asia -->

          <circle
            class="hero-pulse"
            cx="380"
            cy="160"
            r="4"
            style="animation-delay: 0.9s"
          />


          <!-- East Asia -->

          <circle
            class="hero-pulse"
            cx="485"
            cy="154"
            r="4"
            style="animation-delay: 1.2s"
          />


          <!-- Southeast Asia -->

          <circle
            class="hero-pulse"
            cx="455"
            cy="215"
            r="4"
            style="animation-delay: 1.5s"
          />



          <!-- =================================================
               LOCATION DOTS
          ================================================== -->


          <!--
            MAIN TURKEY HUB

            WHITE DOT = MAIN HUB
          -->

          


          <!-- North America -->

          <circle
            class="hero-dot"
            cx="145"
            cy="159"
            r="4"
          />


          <!-- Northern Europe -->

          <circle
            class="hero-dot"
            cx="275"
            cy="120"
            r="4"
          />


          <!-- Central Asia -->

          <circle
            class="hero-dot"
            cx="380"
            cy="160"
            r="4"
          />


          <!-- East Asia -->

          <circle
            class="hero-dot"
            cx="485"
            cy="154"
            r="4"
          />


          <!-- Southeast Asia -->

          <circle
            class="hero-dot"
            cx="455"
            cy="215"
            r="4"
          />

        </svg>

      </div>



      <!-- =================================================
           HERO CONTENT
      ================================================== -->

      <div class="hero-content">

        <p
          class="hero-eyebrow"
          data-i18n="hero_eyebrow"
        ></p>


        <h1
          data-i18n="hero_title"
        ></h1>


        <p
          data-i18n="hero_subtitle"
        ></p>


        <button
          class="cta"
          data-i18n="hero_cta"
        ></button>

      </div>


      <!-- MAP CAPTION -->

      <p
        class="hero-caption"
        data-i18n="hero_caption"
      ></p>

    </main>


    <!-- ===================================================
         SERVICES
    ==================================================== -->

    <section id="services" class="services">

      <div class="section-header">
        <p class="section-eyebrow" data-i18n="services_eyebrow"></p>
        <h2 data-i18n="services_title"></h2>
        <p class="section-subtitle" data-i18n="services_subtitle"></p>
      </div>

      <div class="services-grid">

        <!-- Customs Consultancy -->
        <div class="service-card">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
              <path d="M9 7.5h6"/>
              <path d="M9 11h6"/>
              <path d="m9.25 14.75 1.5 1.5L14.75 12.25"/>
            </svg>
          </div>
          <h3 data-i18n="service_1_title"></h3>
          <p data-i18n="service_1_desc"></p>
        </div>

        <!-- Import Operations -->
        <div class="service-card">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v10"/>
              <path d="m7 9 5 5 5-5"/>
              <path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>
            </svg>
          </div>
          <h3 data-i18n="service_2_title"></h3>
          <p data-i18n="service_2_desc"></p>
        </div>

        <!-- Export Operations -->
        <div class="service-card">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21V11"/>
              <path d="m7 15 5-5 5 5"/>
              <path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>
            </svg>
          </div>
          <h3 data-i18n="service_3_title"></h3>
          <p data-i18n="service_3_desc"></p>
        </div>

        <!-- Bonded Warehousing -->
        <div class="service-card">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21V10l9-6 9 6v11"/>
              <path d="M3 21h18"/>
              <path d="M9 21v-6h6v6"/>
            </svg>
          </div>
          <h3 data-i18n="service_4_title"></h3>
          <p data-i18n="service_4_desc"></p>
        </div>

        <!-- Foreign Trade Consulting -->
        <div class="service-card">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18"/>
              <path d="M12 3a15 15 0 0 1 0 18"/>
              <path d="M12 3a15 15 0 0 0 0 18"/>
            </svg>
          </div>
          <h3 data-i18n="service_5_title"></h3>
          <p data-i18n="service_5_desc"></p>
        </div>

        <!-- Logistics Consulting -->
        <div class="service-card">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7h11v10H3z"/>
              <path d="M14 10h4l3 3v4h-7z"/>
              <circle cx="7.5" cy="18" r="1.6"/>
              <circle cx="17.5" cy="18" r="1.6"/>
            </svg>
          </div>
          <h3 data-i18n="service_6_title"></h3>
          <p data-i18n="service_6_desc"></p>
        </div>

      </div>

    </section>



    <!-- ===================================================
         ABOUT
    ==================================================== -->

    <section id="about" class="about">

      <div class="section-header">
        <p class="section-eyebrow" data-i18n="about_eyebrow"></p>
        <h2 data-i18n="about_title"></h2>
      </div>

      <div class="about-grid">

        <p class="about-text" data-i18n="about_text"></p>

        <ul class="about-highlights">

          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="m8.5 12.5 2.5 2.5 4.5-5"/>
            </svg>
            <span data-i18n="about_highlight_1"></span>
          </li>

          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="m8.5 12.5 2.5 2.5 4.5-5"/>
            </svg>
            <span data-i18n="about_highlight_2"></span>
          </li>

          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="m8.5 12.5 2.5 2.5 4.5-5"/>
            </svg>
            <span data-i18n="about_highlight_3"></span>
          </li>

          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="m8.5 12.5 2.5 2.5 4.5-5"/>
            </svg>
            <span data-i18n="about_highlight_4"></span>
          </li>

        </ul>

      </div>

    </section>



    <!-- ===================================================
         CONTACT
    ==================================================== -->

    <section id="contact" class="contact">

      <div class="section-header">
        <p class="section-eyebrow" data-i18n="contact_eyebrow"></p>
        <h2 data-i18n="contact_title"></h2>
        <p class="section-subtitle" data-i18n="contact_subtitle"></p>
      </div>

      <div class="contact-grid">

        <div class="contact-info">

          <div class="contact-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11Z"/>
              <circle cx="12" cy="10" r="2.5"/>
            </svg>
            <div>
              <p class="contact-info-label" data-i18n="contact_address_label"></p>
              <p class="contact-info-value" data-i18n="contact_address_value"></p>
            </div>
          </div>

          <div class="contact-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.5 3h3l1.5 4-2 1.5a9 9 0 0 0 4.5 4.5L15 11l4 1.5v3a2 2 0 0 1-2 2 13.5 13.5 0 0 1-12.5-12.5 2 2 0 0 1 2-2Z"/>
            </svg>
            <div>
              <p class="contact-info-label" data-i18n="contact_phone_label"></p>
              <p class="contact-info-value" data-i18n="contact_phone_value"></p>
            </div>
          </div>

          <div class="contact-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3 7 9 6 9-6"/>
            </svg>
            <div>
              <p class="contact-info-label" data-i18n="contact_email_label"></p>
              <p class="contact-info-value" data-i18n="contact_email_value"></p>
            </div>
          </div>

          <div class="contact-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v5l3.5 2"/>
            </svg>
            <div>
              <p class="contact-info-label" data-i18n="contact_hours_label"></p>
              <p class="contact-info-value" data-i18n="contact_hours_value"></p>
            </div>
          </div>

        </div>

        <form class="contact-form" id="contactForm" novalidate>

          <div class="contact-form-row">

            <div class="contact-field">
              <label for="contactName" data-i18n="contact_form_name"></label>
              <input type="text" id="contactName" name="name" required>
            </div>

            <div class="contact-field">
              <label for="contactEmail" data-i18n="contact_form_email"></label>
              <input type="email" id="contactEmail" name="email" required>
            </div>

          </div>

          <div class="contact-field">
            <label for="contactMessage" data-i18n="contact_form_message"></label>
            <textarea id="contactMessage" name="message" rows="5" required></textarea>
          </div>

          <button type="submit" class="cta contact-submit" data-i18n="contact_form_submit"></button>

          <p class="contact-form-note hidden" id="contactFormNote" data-i18n="contact_form_success"></p>

        </form>

      </div>

    </section>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

      <p
        data-i18n="footer_text"
      ></p>

    </footer>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="script.js"></script>

</body>
</html>
